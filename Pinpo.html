<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin for Prototype 原型标注</title>
    <style>
        :root {
            --ink: #20242c;
            --muted: #68707d;
            --line: #dfe4ea;
            --panel: #ffffff;
            --canvas: #edf1f5;
            --accent: #e34b31;
            --accent-2: #0e8f7b;
            --accent-3: #c79a13;
            --soft: #f7f9fb;
            --focus: rgba(227, 75, 49, 0.18);
            --radius: 8px;
            --radius-sm: 6px;
            --shadow: 0 18px 46px rgba(32, 36, 44, 0.13);
            --shadow-soft: 0 8px 24px rgba(32, 36, 44, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
            background:
                linear-gradient(90deg, rgba(32, 36, 44, 0.045) 1px, transparent 1px),
                linear-gradient(180deg, rgba(32, 36, 44, 0.045) 1px, transparent 1px),
                linear-gradient(135deg, rgba(14, 143, 123, 0.05), transparent 34%),
                var(--canvas);
            background-size: 32px 32px;
            color: var(--ink);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button,
        .file-trigger,
        input,
        textarea,
        select {
            transition:
                border-color 140ms ease,
                background-color 140ms ease,
                box-shadow 140ms ease,
                transform 140ms ease,
                color 140ms ease;
        }

        button:focus-visible,
        .file-trigger:focus-within,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 0;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus);
        }

        .app {
            min-height: 100vh;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        .topbar {
            min-height: 50px;
            display: grid;
            grid-template-columns: minmax(178px, auto) minmax(0, 1fr) auto;
            align-items: center;
            gap: 14px;
            padding: 7px 12px;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(18px) saturate(1.25);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .brand {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            justify-self: start;
            gap: 9px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            display: block;
            filter: drop-shadow(0 8px 10px rgba(227, 75, 49, 0.2));
        }

        .brand-wordmark {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .brand-wordmark strong {
            font-size: 16px;
            line-height: 1;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .brand-wordmark span {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .project-title {
            min-width: 0;
            max-width: min(720px, 52vw);
            justify-self: center;
            height: 32px;
            padding: 0 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            border: 1px solid rgba(32, 36, 44, 0.08);
            border-radius: var(--radius-sm);
            background: rgba(247, 249, 251, 0.88);
        }

        .project-title-label {
            flex: 0 0 auto;
            color: var(--muted);
            font-weight: 700;
        }

        .project-title-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mode-switch {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #f2f5f7;
        }

        .mode-switch button {
            height: 28px;
            min-width: 76px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--ink);
            font-size: 12px;
            font-weight: 700;
        }

        .mode-switch button.active {
            background: var(--ink);
            color: #fff;
            box-shadow: var(--shadow-soft);
        }

        .toolbar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            min-width: 0;
        }

        .top-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: center;
            flex-wrap: nowrap;
            gap: 6px;
            min-width: 0;
        }

        .mode-hint {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .file-trigger,
        .tool-btn {
            height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .file-trigger:hover,
        .tool-btn:hover:not(:disabled) {
            border-color: #c9d1db;
            background: #f9fbfc;
            transform: translateY(-1px);
        }

        .icon-control {
            width: 38px;
            min-width: 38px;
            flex: 0 0 38px;
            justify-content: center;
            padding: 0;
            font-size: 18px;
            line-height: 1;
        }

        .tool-btn.primary {
            border-color: var(--ink);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 16px rgba(227, 75, 49, 0.22);
        }

        .tool-btn.primary:hover:not(:disabled) {
            background: #d9432b;
        }

        .tool-btn.review-export {
            border-color: #b9d9d2;
            background: #edf9f6;
            color: #087565;
        }

        .tool-btn.review-export:hover:not(:disabled) {
            border-color: #82c4b7;
            background: #ddf4ef;
        }

        .tool-btn:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            box-shadow: none;
        }

        .file-trigger input {
            display: none;
        }

        .workspace {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            grid-template-rows: minmax(0, 1fr);
            gap: 14px;
            padding: 14px;
            overflow: hidden;
        }

        .stage-panel,
        .side-panel {
            min-height: 0;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .stage-panel {
            display: grid;
            grid-template-rows: 1fr;
            overflow: hidden;
        }

        .stage-wrap {
            min-height: 0;
            position: relative;
            background:
                radial-gradient(circle at top left, rgba(227, 75, 49, 0.08), transparent 260px),
                radial-gradient(circle at bottom right, rgba(14, 143, 123, 0.08), transparent 280px),
                #e3e8ed;
            overflow: hidden;
        }

        .frame-shell {
            position: absolute;
            inset: 10px;
            border: 1px solid #cbd3dc;
            border-radius: var(--radius-sm);
            background: #fff;
            box-shadow: 0 18px 42px rgba(32, 36, 44, 0.14);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #fff;
        }

        .annotation-layer {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
        }

        .annotation-layer.annotating {
            cursor: crosshair;
            pointer-events: auto;
        }

        .layer-shade {
            position: absolute;
            inset: 0;
            display: none;
            background:
                linear-gradient(90deg, rgba(227, 75, 49, 0.05) 1px, transparent 1px),
                linear-gradient(180deg, rgba(227, 75, 49, 0.05) 1px, transparent 1px),
                rgba(227, 75, 49, 0.025);
            background-size: 24px 24px;
        }

        .annotation-layer.annotating .layer-shade {
            display: block;
        }

        .marker {
            position: absolute;
            z-index: 9;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 2px solid #fff;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 0 0 2px var(--ink), 0 8px 18px rgba(227, 75, 49, 0.25);
            user-select: none;
            pointer-events: auto;
        }

        .marker.selected {
            background: var(--accent-2);
        }

        .box-marker {
            position: absolute;
            z-index: 8;
            border: 2px solid var(--accent);
            border-radius: 2px;
            background: rgba(227, 75, 49, 0.1);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.85), 0 10px 20px rgba(227, 75, 49, 0.14);
            pointer-events: auto;
        }

        .box-marker.selected {
            border-color: var(--accent-2);
            background: rgba(14, 143, 123, 0.14);
        }

        .box-badge {
            position: absolute;
            left: -2px;
            top: -30px;
            min-width: 28px;
            height: 26px;
            display: grid;
            place-items: center;
            padding: 0 8px;
            border: 2px solid #fff;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 0 0 2px var(--ink);
        }

        .box-marker.selected .box-badge {
            background: var(--accent-2);
        }

        .marker.annotation-hidden,
        .box-marker.annotation-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .annotation-layer:not(.annotating) .marker,
        .annotation-layer:not(.annotating) .box-marker {
            pointer-events: none;
        }

        .draft-box {
            position: absolute;
            z-index: 12;
            border: 2px dashed var(--ink);
            border-radius: 2px;
            background: rgba(199, 154, 19, 0.14);
            pointer-events: none;
        }

        .empty-state {
            position: absolute;
            inset: 16px;
            z-index: 14;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 247, 214, 0.9), transparent 260px),
                linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(247, 249, 251, 0.92)),
                repeating-linear-gradient(-45deg, transparent 0 12px, rgba(32, 36, 44, 0.035) 12px 13px);
            text-align: center;
            padding: 32px;
        }

        .empty-card {
            width: min(560px, 100%);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
            box-shadow: var(--shadow);
            padding: 34px;
        }

        .empty-card::before {
            content: "PinPo";
            display: inline-flex;
            align-items: center;
            height: 24px;
            padding: 0 10px;
            margin-bottom: 14px;
            border-radius: 999px;
            background: #fff7d6;
            color: #9b3a24;
            font-size: 12px;
            font-weight: 800;
        }

        .empty-card h1 {
            margin: 0 0 12px;
            font-size: clamp(25px, 4vw, 38px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .empty-card p {
            margin: 0 auto 22px;
            max-width: 430px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .empty-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .side-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        .side-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(135deg, rgba(255, 247, 214, 0.72), transparent 68%),
                #fff;
        }

        .side-head h2 {
            margin: 0;
            font-size: 17px;
            line-height: 1.2;
        }

        .side-meta {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent-2);
            display: inline-block;
            margin-right: 6px;
        }

        .side-scroll {
            min-height: 0;
            overflow: auto;
            background: var(--soft);
            scrollbar-width: thin;
            scrollbar-color: #b9c2cc transparent;
        }

        .annotation-list {
            padding: 10px;
            display: grid;
            gap: 8px;
        }

        .annotation-item {
            width: 100%;
            text-align: left;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fff;
            padding: 10px;
            display: grid;
            gap: 6px;
        }

        .annotation-item:hover {
            border-color: #c7d0da;
            background: #fbfcfd;
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }

        .annotation-item.active {
            border-color: var(--ink);
            background: #ffffff;
            box-shadow: inset 3px 0 0 var(--accent), var(--shadow-soft);
        }

        .item-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .item-title {
            min-width: 0;
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tag {
            flex: none;
            height: 22px;
            display: inline-flex;
            align-items: center;
            padding: 0 8px;
            border: 1px solid rgba(23, 23, 23, 0.15);
            border-radius: 999px;
            background: #f0f6f4;
            color: #0b6b5d;
            font-size: 12px;
            font-weight: 700;
        }

        .item-desc {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .editor {
            border-top: 1px solid var(--line);
            background: #fff;
            padding: 12px;
        }

        .editor-empty {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
            padding: 8px 2px;
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 10px;
        }

        .field label {
            color: #35383d;
            font-size: 12px;
            font-weight: 800;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--ink);
            padding: 9px 10px;
            font-size: 13px;
            outline: none;
        }

        .field textarea {
            min-height: 72px;
            resize: vertical;
            line-height: 1.6;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus);
        }

        .editor-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .danger {
            color: #a52613;
            border-color: #f0b4aa;
            background: #fff5f3;
        }

        .danger:hover:not(:disabled) {
            border-color: #dc8f81;
            background: #fff0ed;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 80;
            transform: translateX(-50%);
            max-width: min(560px, calc(100vw - 28px));
            padding: 10px 14px;
            border: 1px solid var(--ink);
            background: #fff;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            box-shadow: 5px 5px 0 rgba(23, 23, 23, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        @media (max-width: 1080px) {
            .topbar {
                grid-template-columns: minmax(160px, auto) minmax(0, 1fr);
                padding: 7px 10px;
            }

            .project-title {
                order: 3;
                grid-column: 1 / -1;
                max-width: 100%;
                justify-self: stretch;
                justify-content: flex-start;
            }

            .toolbar {
                justify-content: flex-end;
                flex-wrap: wrap;
            }

            .top-actions {
                flex-wrap: wrap;
            }

            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) minmax(260px, 36vh);
                gap: 12px;
                padding: 12px;
            }

            .stage-panel {
                min-height: 0;
            }

            .side-panel {
                min-height: 0;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .brand,
            .project-title,
            .top-actions {
                justify-self: stretch;
            }

            .top-actions {
                justify-content: flex-start;
            }

            .mode-hint {
                width: 100%;
            }

            .workspace {
                padding: 10px;
                gap: 10px;
            }

            .frame-shell,
            .empty-state {
                inset: 8px;
            }

            .mode-switch {
                width: 100%;
            }

            .mode-switch button {
                min-width: 0;
            }

            .file-trigger,
            .tool-btn {
                flex: 1 1 auto;
                justify-content: center;
                min-width: 112px;
            }

            .icon-control {
                flex: 0 0 36px;
                min-width: 36px;
            }
        }

        /* Digital drafting desk — visual system */
        :root {
            --ink: #111827;
            --muted: #667085;
            --line: #d8e0eb;
            --panel: #ffffff;
            --canvas: #e9eef6;
            --accent: #f05a47;
            --accent-2: #2563eb;
            --accent-3: #0f766e;
            --soft: #f6f8fc;
            --focus: rgba(37, 99, 235, 0.2);
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
            --shadow-soft: 0 7px 20px rgba(15, 23, 42, 0.08);
            --topbar: #101827;
            --blue-soft: #eaf1ff;
            --utility-font: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        }

        body {
            font-family: "Segoe UI Variable", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--canvas);
            color: var(--ink);
        }

        button:focus-visible,
        .file-trigger:focus-within,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px var(--focus);
        }

        .topbar {
            min-height: 64px;
            grid-template-columns: 310px minmax(160px, 1fr) auto;
            gap: 20px;
            padding: 10px 18px;
            background: var(--topbar);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.2);
            backdrop-filter: none;
        }

        .brand {
            gap: 11px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            flex-basis: 42px;
            overflow: visible;
            filter: drop-shadow(0 7px 14px rgba(37, 99, 235, 0.3));
            transform-origin: 50% 78%;
            transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .brand:hover .brand-logo {
            transform: rotate(-6deg) translateY(-1px) scale(1.04);
        }

        .brand-logo .pinpo-ear,
        .brand-logo .pinpo-body {
            fill: #4f8df7;
            stroke: #f8fafc;
            stroke-width: 2.4;
            stroke-linejoin: round;
        }

        .brand-logo .pinpo-muzzle {
            fill: #eff6ff;
        }

        .brand-logo .pinpo-eye {
            fill: #17233a;
            stroke: none;
        }

        .brand-logo .pinpo-smile {
            fill: none;
            stroke: #0f172a;
        }

        .brand-logo .pinpo-cheek {
            fill: #ff7968;
        }

        .brand-logo .pinpo-sparkle {
            fill: #fbbf24;
            stroke: #fff7d6;
            stroke-width: 1.2;
        }

        .brand-wordmark {
            align-items: center;
            gap: 8px;
        }

        .brand-wordmark strong {
            color: #f8fafc;
            font-family: "Aptos Display", "Segoe UI Variable Display", "MiSans", sans-serif;
            font-size: 18px;
            font-weight: 760;
            letter-spacing: 0.01em;
        }

        .brand-wordmark span {
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.22);
            color: #94a3b8;
            font-family: var(--utility-font);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .project-title {
            height: 38px;
            max-width: min(680px, 46vw);
            gap: 8px;
            padding: 0 16px;
            border-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #f8fafc;
            font-size: 13px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .project-title-label {
            color: #94a3b8;
            font-family: var(--utility-font);
            font-size: 10px;
            letter-spacing: 0.08em;
        }

        .project-title-label::after {
            content: " /";
            color: #475569;
        }

        .top-actions {
            justify-self: end;
            gap: 8px;

<body>
    <div class="app">

                            <h1>钉住每一调整，高效沟通</h1>

                                    选择 HTML 文件
                                    <input id="emptyHtmlInput" type="file" accept=".html,.htm,text/html">
                                </label>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>


    <script>
        const STORAGE_KEY = "html-annotation-tool.current-project";
        const ANNOTATION_BACKUP_PREFIX = "html-annotation-tool.annotation-backup.";
        const ANNOTATION_BACKUP_INDEX_KEY = "html-annotation-tool.annotation-backup-index";
        const MAX_ANNOTATION_BACKUPS = 12;
        const TYPES = ["交互", "样式", "数据", "状态", "疑问", "逻辑"];

        const state = {
            mode: "browse",
            html: "",
            fileName: "",
            sourceId: "",
            annotations: [],
            forcedLocateId: null,
            locateDomRestores: [],
            locateToken: 0,
            selectedId: null,
            draftRect: null,
            pointerStart: null,
            scrollX: 0,
            scrollY: 0,
            saveTimer: null,
            pendingProject: null,
            storageWarningShown: false,
            frameObserver: null,
            frameVisibilityTimer: null,
            frameRenderPending: false,
            _justCreated: false
        };

        const els = {
            htmlInput: document.getElementById("htmlInput"),
            emptyHtmlInput: document.getElementById("emptyHtmlInput"),
            exportHtmlBtn: document.getElementById("exportHtmlBtn"),
            exportReviewBtn: document.getElementById("exportReviewBtn"),
            restoreDraftBtn: document.getElementById("restoreDraftBtn"),
            browseModeBtn: document.getElementById("browseModeBtn"),
            annotateModeBtn: document.getElementById("annotateModeBtn"),
            projectName: document.getElementById("projectName"),
            modeHint: document.getElementById("modeHint"),
            frame: document.getElementById("prototypeFrame"),
            frameShell: document.getElementById("frameShell"),
            layer: document.getElementById("annotationLayer"),
            emptyState: document.getElementById("emptyState"),
            annotationList: document.getElementById("annotationList"),
            editor: document.getElementById("editor"),
            saveStatus: document.getElementById("saveStatus"),
            countText: document.getElementById("countText"),
            toast: document.getElementById("toast")
        };

        function uid() {
            return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function cloneSerializable(value, fallback) {
            try {
                return JSON.parse(JSON.stringify(value));
            } catch (error) {
                return fallback;
            }
        }

        function stableHash(value) {
            const text = String(value || "");
            let hashA = 2166136261;
            let hashB = 2246822519;
            for (let i = 0; i < text.length; i += 1) {
                const code = text.charCodeAt(i);
                hashA = Math.imul(hashA ^ code, 16777619);
                hashB = Math.imul(hashB ^ code, 3266489917);
            }
            return (hashA >>> 0).toString(36) + (hashB >>> 0).toString(36) + "-" + text.length.toString(36);
        }

        function normalizeAnnotations(items) {
            const usedIds = new Set();
            return (Array.isArray(items) ? items : []).filter(item => item && typeof item === "object").map(item => {
                const note = cloneSerializable(item, {}) || {};
                let id = String(note.id || uid());
                while (usedIds.has(id)) {
                    id = uid();
                }
                usedIds.add(id);
                if (note.scene && typeof note.scene === "object") {
                    delete note.scene.trail;
                }
                const createdAt = note.createdAt || new Date().toISOString();
                return {
                    ...note,
                    id,
                    createdAt,
                    updatedAt: note.updatedAt || createdAt
                };
            });
        }

        function annotationIntegrity(annotations) {
            const snapshot = normalizeAnnotations(annotations);
            return {
                annotationCount: snapshot.length,
                annotationIds: snapshot.map(note => note.id),
                digest: stableHash(JSON.stringify(snapshot))
            };
        }

        function verifyProjectIntegrity(project) {
            if (!project || !project.integrity) {
                return true;
            }
            const actual = annotationIntegrity(project.annotations);
            const legacyDigest = stableHash(JSON.stringify(Array.isArray(project.annotations) ? project.annotations : []));
            return actual.annotationCount === Number(project.integrity.annotationCount) &&
                (actual.digest === project.integrity.digest || legacyDigest === project.integrity.digest);
        }

        function backupKey(sourceId) {
            return ANNOTATION_BACKUP_PREFIX + sourceId;
        }

        function persistAnnotationBackup(project) {
            if (!project || !project.sourceId) {
                return false;
            }
            try {
                const backup = {
                    version: 2,
                    sourceId: project.sourceId,
                    fileName: project.fileName,
                    annotations: normalizeAnnotations(project.annotations),
                    integrity: annotationIntegrity(project.annotations),
                    updatedAt: project.updatedAt || new Date().toISOString()
                };
                let index = [];
                try {
                    index = JSON.parse(localStorage.getItem(ANNOTATION_BACKUP_INDEX_KEY) || "[]");
                } catch (error) {
                    index = [];
                }
                index = (Array.isArray(index) ? index : []).filter(id => id && id !== project.sourceId);
                while (index.length >= MAX_ANNOTATION_BACKUPS) {
                    localStorage.removeItem(backupKey(index.pop()));
                }
                localStorage.setItem(backupKey(project.sourceId), JSON.stringify(backup));
                index.unshift(project.sourceId);
                localStorage.setItem(ANNOTATION_BACKUP_INDEX_KEY, JSON.stringify(index.slice(0, MAX_ANNOTATION_BACKUPS)));
                return true;
            } catch (error) {
                return false;
            }
        }

        function readAnnotationBackup(html) {
            const sourceId = stableHash(html);
            try {
                const raw = localStorage.getItem(backupKey(sourceId));
                if (!raw) {
                    return null;
                }
                const backup = JSON.parse(raw);
                if (!backup || backup.sourceId !== sourceId || !verifyProjectIntegrity(backup)) {
                    return null;
                }
                return {
                    ...backup,
                    annotations: normalizeAnnotations(backup.annotations)
                };
            } catch (error) {
                return null;
            }

        let toastTimer = null;

        function showToast(message) {
            els.toast.textContent = message;
            els.toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);

        function setMode(mode) {
            state.mode = mode;
            const annotating = mode === "annotate";
            if (annotating) {
                clearLocateDomChanges();
                state.forcedLocateId = null;
            }
            els.browseModeBtn.classList.toggle("active", !annotating);
            els.annotateModeBtn.classList.toggle("active", annotating);
            els.layer.classList.toggle("annotating", annotating);
            els.modeHint.textContent = annotating
                ? "标注模式：点击打点，拖拽框选区域"
                : "浏览模式：可以正常操作原型";
            renderAnnotations();
        }

        function getProject() {
            const annotations = normalizeAnnotations(state.annotations);
            const project = {
                version: 2,
                fileName: state.fileName,
                html: state.html,
                sourceId: state.sourceId || stableHash(state.html),
                annotations,
                updatedAt: new Date().toISOString()
            };
            project.integrity = annotationIntegrity(annotations);
            return project;
        }

        function persistProjectSnapshot(project, reflectStatus = true) {
            if (!project || typeof project.html !== "string") {
                return false;
            }
            const annotationSaved = persistAnnotationBackup(project);
            let projectSaved = false;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(project));
                projectSaved = true;
            } catch (error) {
                projectSaved = false;
            }

            if (reflectStatus) {
                if (projectSaved) {
                    els.saveStatus.textContent = "已保存 " + project.annotations.length + " 条标注";
                } else if (annotationSaved) {
                    els.saveStatus.textContent = "标注已独立备份";
                } else {
                    els.saveStatus.textContent = "自动保存失败";
                }
            }
            if (!projectSaved && !state.storageWarningShown) {
                state.storageWarningShown = true;
                showToast(annotationSaved
                    ? "原型较大，标注已独立备份；请及时导出标注 HTML"
                    : "浏览器本地空间不足，请立即导出标注 HTML");
            }
            return projectSaved || annotationSaved;
        }

        function flushPendingSave(reflectStatus = true) {
            clearTimeout(state.saveTimer);
            state.saveTimer = null;
            const project = state.pendingProject;
            state.pendingProject = null;
            return project ? persistProjectSnapshot(project, reflectStatus) : true;
        }

        function scheduleSave() {
            if (!state.html) {
                return;
            }
            const project = getProject();
            state.pendingProject = project;
            const annotationSaved = persistAnnotationBackup(project);
            els.saveStatus.textContent = annotationSaved
                ? "已保护 " + project.annotations.length + " 条标注"
                : "保存中";
            clearTimeout(state.saveTimer);
            state.saveTimer = setTimeout(() => flushPendingSave(true), 220);

        function setFrameHtml(html) {
            if (state.frameObserver) {
                state.frameObserver.disconnect();

            }

            state.locateDomRestores = [];
            state.scrollX = 0;
            state.scrollY = 0;
            els.frame.removeAttribute("src");
            els.frame.srcdoc = "";
            els.frame.srcdoc = buildFramePreviewHtml(html);

        function buildFramePreviewHtml(html) {
            const script = "<scr" + "ipt id=\"pinpo-frame-compat-script\">(function(){try{var rawReplace=history.replaceState.bind(history);var rawPush=history.pushState.bind(history);function normalizeUrl(url){if(typeof url!==\"string\"){return url;}var hashIndex=url.indexOf(\"#\");if(hashIndex>=0){return location.href.split(\"#\")[0]+url.slice(hashIndex);}return url;}history.replaceState=function(state,title,url){return rawReplace(state,title,normalizeUrl(url));};history.pushState=function(state,title,url){return rawPush(state,title,normalizeUrl(url));};}catch(error){}})();<" + "/scr" + "ipt>";

        function injectIntoHtmlHead(html, injection) {
            const headMatch = html.match(/<head\b[^>]*>/i);
            if (headMatch) {
                const idx = headMatch.index + headMatch[0].length;
                return html.slice(0, idx) + injection + html.slice(idx);
            }
            const htmlMatch = html.match(/<html\b[^>]*>/i);
            if (htmlMatch) {
                const idx = htmlMatch.index + htmlMatch[0].length;
                return html.slice(0, idx) + "\n<head>" + injection + "</head>\n" + html.slice(idx);
            }
            return injection + html;
        }

        function loadProject(project, message) {
            if (!project || typeof project.html !== "string") {
                showToast("项目文件格式不正确");
                return;
            }
            flushPendingSave(false);
            state.html = project.html;
            state.fileName = project.fileName || "未命名原型.html";
            state.sourceId = project.sourceId || stableHash(project.html);
            state.annotations = normalizeAnnotations(project.annotations);
            state.selectedId = state.annotations[0]?.id || null;
            state.scrollX = 0;
            state.scrollY = 0;
            setFrameHtml(state.html);
            els.emptyState.style.display = "none";
            els.projectName.textContent = state.fileName;
            els.exportHtmlBtn.disabled = false;
            els.exportReviewBtn.disabled = false;
            setMode("browse");
            renderAll();
            scheduleSave();
            showToast(message || "项目已载入");
        }

        function readFile(file, callback) {
            const reader = new FileReader();
            reader.onload = () => callback(String(reader.result || ""));
            reader.onerror = () => showToast("文件读取失败");
            reader.readAsText(file);
        }

        function extractEditableProjectFromHtml(html, fallbackFileName) {
            let doc = null;
            try {
                doc = new DOMParser().parseFromString(html, "text/html");
            } catch (error) {
                return null;
            }
            const dataNode = doc.getElementById("html-annotation-project-data");
            if (dataNode) {
                try {
                    const project = JSON.parse(dataNode.textContent || "");
                    if (!project || typeof project.html !== "string") {
                        throw new Error("Invalid embedded project");
                    }
                    if (!verifyProjectIntegrity(project)) {
                        showToast("检测到标注校验不一致，已尝试读取全部可用标注");
                    }
                    return {
                        ...project,
                        fileName: project.fileName || fallbackFileName || "未命名原型.html",
                        sourceId: project.sourceId || stableHash(project.html),
                        annotations: normalizeAnnotations(project.annotations)
                    };
                } catch (error) {
                    showToast("主项目数据异常，正在使用标注副本恢复");
                }
            }

            const legacyScript = doc.getElementById("html-annotation-export-script");
            if (!legacyScript) {
                return null;
            }
            const match = (legacyScript.textContent || "").match(/window\.__HTML_ANNOTATION_EXPORT__\s*=\s*({[\s\S]*?});\s*\n/);
            if (!match) {
                return null;
            }
            try {
                const legacyProject = JSON.parse(match[1]);
                const annotations = normalizeAnnotations(legacyProject.annotations);
                if (legacyProject.integrity && !verifyProjectIntegrity(legacyProject)) {
                    showToast("标注副本校验不一致，已尽量恢复全部可用内容");
                }
                doc.getElementById("html-annotation-export-style")?.remove();
                doc.getElementById("html-annotation-export-script")?.remove();
                doc.getElementById("html-annotation-project-data")?.remove();
                doc.getElementById("html-annotation-export-layer")?.remove();
                doc.getElementById("html-annotation-export-tooltip")?.remove();
                doc.getElementById("html-annotation-review-style")?.remove();
                doc.getElementById("html-annotation-review-script")?.remove();
                doc.getElementById("html-annotation-review-panel")?.remove();
                const restoredHtml = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
                return {
                    version: 2,
                    fileName: fallbackFileName || "未命名原型.html",
                    html: restoredHtml,
                    sourceId: stableHash(restoredHtml),
                    annotations,
                    integrity: annotationIntegrity(annotations)
                };
            } catch (error) {
                showToast("旧版标注 HTML 解析失败");
                return null;
            }
        }

        function importHtml(file) {
            if (!file) {
                return;
            }
            readFile(file, html => {
                const editableProject = extractEditableProjectFromHtml(html, file.name);
                if (editableProject) {
                    loadProject(editableProject, "可编辑标注 HTML 已导入");
                    return;
                }
                const backup = readAnnotationBackup(html);
                loadProject({
                    fileName: file.name,
                    html,
                    sourceId: stableHash(html),
                    annotations: backup ? backup.annotations : []
                }, backup ? "HTML 已导入，并恢复 " + backup.annotations.length + " 条本地标注" : "HTML 原型已导入");
            });
        }

        function restoreDraft() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {

                return;

            try {
                loadProject(JSON.parse(saved), "已恢复本地草稿");

                showToast("本地草稿已损坏");

        function downloadText(fileName, text, type) {
            const blob = new Blob([text], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function baseName(name) {
            return (name || "原型").replace(/\.[^.]+$/, "");

        function refreshVisibleAnnotationScenes() {
            const doc = els.frame.contentDocument;
            const win = getFrameWindow();
            if (!doc || !win) {
                return 0;
            }
            let refreshed = 0;
            state.annotations.forEach(annotation => {
                const source = queryAnnotationPath(doc, annotation.anchorPath);
                const ready = source
                    ? isElementVisible(source, doc, win)
                    : pageContextMatches(annotation);
                if (!ready) {
                    return;
                }
                const scene = captureFrameScene(annotation.pageContext);
                if (!scene) {
                    return;
                }
                annotation.scene = scene;
                annotation.updatedAt = new Date().toISOString();
                refreshed += 1;
            });
            if (refreshed) {
                scheduleSave();
            }
            return refreshed;
        }

        function exportReadonlyHtml() {
            if (!state.html) {
                return;
            }
            refreshVisibleAnnotationScenes();
            flushPendingSave(true);
            const project = getReadonlyProject();
            const doc = buildEmbeddedReadonlyHtml(project);
            if (!exportContainsCompleteProject(doc, project)) {
                els.saveStatus.textContent = "导出校验失败";
                showToast("导出前校验失败，文件未下载，请重试");
                return;
            }
            downloadText(baseName(state.fileName) + "-修改标注.html", doc, "text/html;charset=utf-8");
            els.saveStatus.textContent = "已导出 " + project.annotations.length + " 条标注";
            showToast("已完整导出 " + project.annotations.length + " 条标注，可再次导入编辑");
        }

        function exportReviewHtml() {
            if (!state.html) {
                return;
            }
            refreshVisibleAnnotationScenes();
            flushPendingSave(true);
            const project = getReadonlyProject();
            const legacyWithoutSnapshot = project.annotations.filter(annotation =>
                !Array.isArray(annotation.scene?.domSnapshots) || !annotation.scene.domSnapshots.length
            ).length;
            const doc = buildEmbeddedReviewHtml(project);
            if (!exportContainsCompleteProject(doc, project)) {
                els.saveStatus.textContent = "导出校验失败";
                showToast("评审页导出前校验失败，文件未下载，请重试");

            downloadText(baseName(state.fileName) + "-标注清单.html", doc, "text/html;charset=utf-8");

        function getReadonlyProject() {
            const project = getProject();
            project.annotations = project.annotations.map(annotationForReadonlyExport);

        function exportContainsCompleteProject(html, expectedProject) {
            try {
                const doc = new DOMParser().parseFromString(html, "text/html");
                const node = doc.getElementById("html-annotation-project-data");
                const embedded = JSON.parse(node?.textContent || "null");
                if (!embedded || !verifyProjectIntegrity(embedded)) {
                    return false;
                }
                const expected = annotationIntegrity(expectedProject.annotations);
                const actual = annotationIntegrity(embedded.annotations);
                const exportScript = doc.getElementById("html-annotation-export-script");
                const match = (exportScript?.textContent || "").match(/window\.__HTML_ANNOTATION_EXPORT__\s*=\s*({[\s\S]*?});\s*\n/);
                const backup = match ? JSON.parse(match[1]) : null;
                const backupIntegrity = annotationIntegrity(backup?.annotations);
                return expected.annotationCount === actual.annotationCount &&
                    expected.digest === actual.digest &&
                    expected.annotationCount === backupIntegrity.annotationCount &&
                    expected.digest === backupIntegrity.digest;
            } catch (error) {
                return false;
            }
        }

        function annotationForReadonlyExport(annotation) {
            const note = { ...annotation };
            const doc = els.frame.contentDocument;
            const win = getFrameWindow();
            if (!doc || !win || !note.anchorPath) {
                return note;
            }
            let source = null;
            try {
                source = doc.querySelector(note.anchorPath);
            } catch (error) {
                source = null;
            }
            if (!source || !isElementVisible(source, doc, win)) {
                return note;
            }

            const rect = source.getBoundingClientRect();
            if (!rect.width || !rect.height) {
                return note;
            }

            const layout = annotationLayout(note);
            const isViewport = note.positionMode === "viewport";
            note.x = isViewport ? layout.viewportX : layout.docX;
            note.y = isViewport ? layout.viewportY : layout.docY;
            note.anchorRect = {
                left: rect.left + (isViewport ? 0 : win.scrollX),
                top: rect.top + (isViewport ? 0 : win.scrollY),
                width: rect.width,
                height: rect.height
            };
            note.anchorRectMode = isViewport ? "viewport" : "document";
            note.anchorScrollX = win.scrollX || 0;
            note.anchorScrollY = win.scrollY || 0;
            note.surfaceKey = note.surfaceKey || surfaceKeyForElement(source, doc, win);
            note.pageContext = {
                ...pageContextForElement(source, doc, win),
                ...(note.pageContext || {})
            };
            if (!note.pageContext.local) {
                note.pageContext.local = pageContextForElement(source, doc, win).local;
            }
            const capturedScene = captureFrameScene(note.pageContext);
            if (capturedScene) {
                note.scene = capturedScene;
            }
            return note;
        }

            function rootNameForElement(element) {

                    element.getAttribute("data-page") || "",

                    element.getAttribute("data-view") || "",

                const isSemanticRoot = element.tagName === "MAIN" || element.tagName === "SECTION" || element.tagName === "ARTICLE" || role === "main";

                    "[id*='scene']", "[class*='scene']",
                    "[id*='panel']", "[class*='panel']",
                    "[id*='content']", "[class*='content']",
                    "[id*='detail']", "[class*='detail']",

            function place(node, note, isPoint) {

            function placeEntry(entry) {

                if (entry.box) {

            let activeTooltipAnchor = null;

            const relY = validStored ? (y - storedTop) / storedHeight : 0.5;
            const layoutX = annotation.shape === "rect" ? relX : clamp(relX, 0, 1);
            const layoutY = annotation.shape === "rect" ? relY : clamp(relY, 0, 1);
            const viewportX = rect.left + rect.width * layoutX;
            const viewportY = rect.top + rect.height * layoutY;

            return {
                docX: viewportX + (annotation.positionMode === "viewport" ? 0 : scrollX),
                docY: viewportY + (annotation.positionMode === "viewport" ? 0 : scrollY),
                viewportX,
                viewportY,
                source,
                sourceRect: rect
            };
        }

        function annotationBoxSize(annotation, layout) {
            const storedRect = annotation.anchorRect || {};
            const storedWidth = Number(storedRect.width);
            const storedHeight = Number(storedRect.height);
            const scaleX = storedWidth > 0 && layout.sourceRect ? layout.sourceRect.width / storedWidth : 1;
            const scaleY = storedHeight > 0 && layout.sourceRect ? layout.sourceRect.height / storedHeight : 1;
            return {
                width: Math.max(0, Number(annotation.width || 0) * scaleX),
                height: Math.max(0, Number(annotation.height || 0) * scaleY)
            };
        }

        function annotationHitTestPoint(annotation) {
            const layout = annotationLayout(annotation);
            const point = { x: layout.viewportX, y: layout.viewportY };
            if (annotation.shape === "rect") {
                const size = annotationBoxSize(annotation, layout);
                point.x += size.width / 2;
                point.y += size.height / 2;
            }
            return point;
        }

        function canScrollElement(element, deltaX, deltaY, doc, win) {
            if (!element || element.nodeType !== 1 || element === doc.body || element === doc.documentElement) {
                return false;
            }
            const style = win.getComputedStyle(element);
            const canY = Math.abs(deltaY) > Math.abs(deltaX) &&
                /(auto|scroll|overlay)/.test(style.overflowY) &&
                element.scrollHeight > element.clientHeight + 1 &&
                ((deltaY > 0 && element.scrollTop < element.scrollHeight - element.clientHeight - 1) || (deltaY < 0 && element.scrollTop > 1));
            const canX = Math.abs(deltaX) >= Math.abs(deltaY) &&
                /(auto|scroll|overlay)/.test(style.overflowX) &&
                element.scrollWidth > element.clientWidth + 1 &&
                ((deltaX > 0 && element.scrollLeft < element.scrollWidth - element.clientWidth - 1) || (deltaX < 0 && element.scrollLeft > 1));
            return canY || canX;
        }

        function scrollTargetAtPoint(point, deltaX, deltaY) {
            const doc = els.frame.contentDocument;
            const win = getFrameWindow();
            if (!doc || !win) {
                return null;
            }
            let node = doc.elementFromPoint(point.x, point.y);
            while (node && node !== doc.documentElement) {
                if (canScrollElement(node, deltaX, deltaY, doc, win)) {
                    return node;
                }
                node = node.parentElement;
            }
            return null;
        }

        function sourceElementForAnnotation(annotation) {
            const doc = els.frame.contentDocument;
            if (!doc || !annotation.anchorPath) {
                return null;
            }
            return queryAnnotationPath(doc, annotation.anchorPath);
        }

        function surfaceKeyAtAnnotation(annotation) {
            const doc = els.frame.contentDocument;
            const win = getFrameWindow();
            if (!doc || !win) {
                return "";
            }
            const point = annotationHitTestPoint(annotation);
            const layerRect = els.layer.getBoundingClientRect();
            if (point.x < 0 || point.y < 0 || point.x > layerRect.width || point.y > layerRect.height) {
                return annotation.surfaceKey || "";
            }
            const element = doc.elementFromPoint(point.x, point.y);
            return surfaceKeyForElement(element, doc, win);
        }

        function isAnnotationHidden(annotation) {
            const doc = els.frame.contentDocument;
            const win = getFrameWindow();
            if (!doc || !win) {
                return false;
            }
            if (state.forcedLocateId === annotation.id) {
                const forcedSource = sourceElementForAnnotation(annotation);
                return Boolean(annotation.anchorPath && (!forcedSource || !isElementVisible(forcedSource, doc, win)));
            }
            const point = annotationHitTestPoint(annotation);
            const layerRect = els.layer.getBoundingClientRect();
            if (point.x < 0 || point.y < 0 || point.x > layerRect.width || point.y > layerRect.height) {
                return false;
            }

            if (annotation.anchorPath) {
                if (!pageContextMatches(annotation)) {
                    return true;
                }
                const source = sourceElementForAnnotation(annotation);
                if (!source) {
                    return true;
                }
                if (!isElementVisible(source, doc, win)) {
                    return true;
                }
                const top = doc.elementFromPoint(point.x, point.y);
                if (!top) {
                    return false;
                }
                if (top === source || source.contains(top) || top.contains(source)) {
                    return false;
                }
                const topOverlay = overlayRootForElement(top, doc, win);
                const sourceOverlay = overlayRootForElement(source, doc, win);
                return Boolean(topOverlay && topOverlay !== sourceOverlay);
            }

            if (!pageContextMatches(annotation)) {
                return true;
            }
            const top = doc.elementFromPoint(point.x, point.y);
            if (!top) {
                return false;
            }
            const topOverlay = overlayRootForElement(top, doc, win);
            const expectedOverlay = annotation.pageContext && Object.prototype.hasOwnProperty.call(annotation.pageContext, "overlay")
                ? annotation.pageContext.overlay
                : null;
            if (!expectedOverlay) {
                return Boolean(topOverlay);
            }
            return Boolean(topOverlay && expectedOverlay.path && cssPathForElement(topOverlay, doc) !== expectedOverlay.path);
        }

        function renderPointAnnotation(annotation, index) {
            const marker = document.createElement("button");
            const layout = annotationLayout(annotation);
            marker.type = "button";
            marker.className = "marker" + (annotation.id === state.selectedId ? " selected" : "") + (isAnnotationHidden(annotation) ? " annotation-hidden" : "");
            marker.textContent = index + 1;
            marker.title = annotation.title || "未命名标注";
            marker.style.left = layout.viewportX + "px";
            marker.style.top = layout.viewportY + "px";
            marker.addEventListener("click", event => {
                if (state._justCreated) return;
                event.stopPropagation();
                selectAnnotation(annotation.id, false);
            });
            return marker;
        }

        function renderRectAnnotation(annotation, index) {
            const box = document.createElement("button");
            const layout = annotationLayout(annotation);
            const size = annotationBoxSize(annotation, layout);
            box.type = "button";
            box.className = "box-marker" + (annotation.id === state.selectedId ? " selected" : "") + (isAnnotationHidden(annotation) ? " annotation-hidden" : "");
            box.title = annotation.title || "未命名标注";
            box.style.left = layout.viewportX + "px";
            box.style.top = layout.viewportY + "px";
            box.style.width = size.width + "px";
            box.style.height = size.height + "px";
            box.addEventListener("click", event => {
                if (state._justCreated) return;
                event.stopPropagation();
                selectAnnotation(annotation.id, false);
            });

            const badge = document.createElement("span");
            badge.className = "box-badge";
            badge.textContent = index + 1;
            box.appendChild(badge);
            return box;
        }

        function renderList() {
            els.annotationList.innerHTML = "";
            if (!state.annotations.length) {
                const empty = document.createElement("div");
                empty.className = "editor-empty";
                empty.textContent = state.html ? "切换到标注模式后，点击页面打点或拖拽框选区域。" : "导入 HTML 原型后开始标注。";
                els.annotationList.appendChild(empty);
                return;
            }

            state.annotations.forEach((annotation, index) => {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "annotation-item" + (annotation.id === state.selectedId ? " active" : "");
                item.innerHTML = `
                    <div class="item-line">
                        <span class="item-title">${escapeHtml(annotation.title || "未命名标注")}</span>
                        <span class="tag">${escapeHtml(annotation.type || "交互")}</span>
                    </div>
                    <p class="item-desc">${escapeHtml(annotation.description || "暂无说明")}</p>
                `;
                item.addEventListener("click", () => selectAnnotation(annotation.id, true));
                els.annotationList.appendChild(item);
            });
        }

        function renderEditor() {
            const annotation = state.annotations.find(item => item.id === state.selectedId);
            if (!annotation) {
                els.editor.innerHTML = `<div class="editor-empty">选择一条标注后，可编辑类型、标题和说明。</div>`;
                return;
            }

            els.editor.innerHTML = `
                <div class="field">
                    <label for="editType">类型</label>
                    <select id="editType">
                        ${TYPES.map(type => `<option value="${type}" ${type === annotation.type ? "selected" : ""}>${type}</option>`).join("")}
                    </select>
                </div>
                <div class="field">
                    <label for="editTitle">标题</label>
                    <input id="editTitle" type="text" value="${escapeHtml(annotation.title || "")}" maxlength="80">
                </div>
                <div class="field">
                    <label for="editDescription">说明</label>
                    <textarea id="editDescription" maxlength="1200">${escapeHtml(annotation.description || "")}</textarea>
                </div>
                <div class="editor-actions">
                    <button class="tool-btn" id="focusBtn" type="button">一键定位标注</button>
                    <button class="tool-btn danger" id="deleteBtn" type="button">删除标注</button>
                </div>
            `;

            document.getElementById("editType").addEventListener("change", event => updateSelectedField("type", event.target.value));
            document.getElementById("editTitle").addEventListener("input", event => updateSelectedField("title", event.target.value));
            document.getElementById("editDescription").addEventListener("input", event => updateSelectedField("description", event.target.value));
            document.getElementById("focusBtn").addEventListener("click", () => scrollFrameToAnnotation(annotation.id));
            document.getElementById("deleteBtn").addEventListener("click", deleteSelected);
        }


        els.htmlInput.addEventListener("change", event => importHtml(event.target.files[0]));
        els.emptyHtmlInput.addEventListener("change", event => importHtml(event.target.files[0]));
        els.exportHtmlBtn.addEventListener("click", exportReadonlyHtml);
        els.exportReviewBtn.addEventListener("click", exportReviewHtml);
        els.restoreDraftBtn.addEventListener("click", restoreDraft);
        els.browseModeBtn.addEventListener("click", () => setMode("browse"));
        els.annotateModeBtn.addEventListener("click", () => {
            if (!state.html) {
                showToast("请先导入 HTML 原型");
                return;
            }
            setMode("annotate");
        });
        els.layer.addEventListener("pointerdown", handlePointerDown);
        els.layer.addEventListener("pointermove", handlePointerMove);
        els.layer.addEventListener("pointerup", handlePointerUp);
        els.layer.addEventListener("wheel", handleLayerWheel, { passive: false });
        els.layer.addEventListener("pointercancel", () => {
            state.pointerStart = null;
            state.draftRect = null;
            renderAnnotations();
        });
        els.frame.addEventListener("load", bindFrameScroll);
        window.addEventListener("resize", renderAnnotations);
        window.addEventListener("pagehide", () => flushPendingSave(false));
        window.addEventListener("beforeunload", () => flushPendingSave(false));
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") {
                flushPendingSave(false);
            }
        });

        renderAll();
    </script>
</body>
</html>
